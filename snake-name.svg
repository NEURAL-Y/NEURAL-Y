<svg width="800" height="260" viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- reusable leaf shape -->
    <g id="leafShape">
      <path d="M0,-8 C4.5,-6 5.5,0 0,8 C-5.5,0 -4.5,-6 0,-8 Z"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#00000030" stroke-width="0.6"/>
    </g>

    <!-- gradient readable on both light and dark backgrounds -->
    <linearGradient id="duoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#bfbfbf"/>
      <stop offset="50%" stop-color="#050505"/>
      <stop offset="75%" stop-color="#bfbfbf"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- falling leaves, background layer -->
  <g opacity="0.65">
    <g transform="translate(20,-20)" fill="#c9762b">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-20; 12,90; -10,190; 6,300" keyTimes="0;0.33;0.66;1" dur="8s" begin="-1s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.2s" repeatCount="indefinite"/><use href="#leafShape"/></g>
    </g>
    <g transform="translate(80,-20)" fill="#a3b24a">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-20; -14,100; 10,200; -6,300" keyTimes="0;0.33;0.66;1" dur="9.5s" begin="-4s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="4s" repeatCount="indefinite"/><use href="#leafShape"/></g>
    </g>
    <g transform="translate(140,-20)" fill="#b3541f">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-20; 10,95; -12,195; 8,300" keyTimes="0;0.33;0.66;1" dur="7s" begin="-2.5s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2.8s" repeatCount="indefinite"/><use href="#leafShape" transform="scale(0.8)"/></g>
    </g>
    <g transform="translate(200,-20)" fill="#d99b3f">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-20; -8,90; 14,200; -4,300" keyTimes="0;0.33;0.66;1" dur="8.6s" begin="-6s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.6s" repeatCount="indefinite"/><use href="#leafShape"/></g>
    </g>
    <g transform="translate(260,-20)" fill="#7c9a52">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-20; 13,95; -9,195; 5,300" keyTimes="0;0.33;0.66;1" dur="7.8s" begin="-3s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="3s" repeatCount="indefinite"/><use href="#leafShape" transform="scale(0.75)"/></g>
    </g>
    <g transform="translate(320,-20)" fill="#c9762b">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-20; -11,100; 9,200; -7,300" keyTimes="0;0.33;0.66;1" dur="9s" begin="-0.5s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.4s" repeatCount="indefinite"/><use href="#leafShape"/></g>
    </g>
    <g transform="translate(380,-20)" fill="#a3b24a">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-20; 9,90; -13,195; 6,300" keyTimes="0;0.33;0.66;1" dur="7.4s" begin="-5s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="3.4s" repeatCount="indefinite"/><use href="#leafShape" transform="scale(0.85)"/></g>
    </g>
    <g transform="translate(440,-20)" fill="#b3541f">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-20; -12,95; 11,195; -5,300" keyTimes="0;0.33;0.66;1" dur="8.2s" begin="-3.8s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="3.9s" repeatCount="indefinite"/><use href="#leafShape"/></g>
    </g>
    <g transform="translate(500,-20)" fill="#d99b3f">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-20; 10,100; -8,200; 4,300" keyTimes="0;0.33;0.66;1" dur="9.2s" begin="-7s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.1s" repeatCount="indefinite"/><use href="#leafShape" transform="scale(0.7)"/></g>
    </g>
    <g transform="translate(560,-20)" fill="#c9762b">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-20; 11,92; -9,192; 7,300" keyTimes="0;0.33;0.66;1" dur="8.4s" begin="-2s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.7s" repeatCount="indefinite"/><use href="#leafShape"/></g>
    </g>
    <g transform="translate(620,-20)" fill="#7c9a52">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-20; -10,98; 13,198; -6,300" keyTimes="0;0.33;0.66;1" dur="7.6s" begin="-4.5s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="3.3s" repeatCount="indefinite"/><use href="#leafShape" transform="scale(0.8)"/></g>
    </g>
    <g transform="translate(680,-20)" fill="#a3b24a">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-20; 9,90; -13,195; 6,300" keyTimes="0;0.33;0.66;1" dur="8.8s" begin="-5.5s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="4.1s" repeatCount="indefinite"/><use href="#leafShape"/></g>
    </g>
    <g transform="translate(740,-20)" fill="#b3541f">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-20; -12,95; 11,195; -5,300" keyTimes="0;0.33;0.66;1" dur="7.2s" begin="-1.5s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="2.9s" repeatCount="indefinite"/><use href="#leafShape" transform="scale(0.75)"/></g>
    </g>
    <g transform="translate(780,-20)" fill="#d99b3f">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-20; 10,100; -8,200; 4,300" keyTimes="0;0.33;0.66;1" dur="9.6s" begin="-6.5s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.5s" repeatCount="indefinite"/><use href="#leafShape" transform="scale(0.65)"/></g>
    </g>
    <g transform="translate(50,-20)" fill="#c9762b">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-20; -9,95; 12,195; -6,300" keyTimes="0;0.33;0.66;1" dur="8.9s" begin="-3.2s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.8s" repeatCount="indefinite"/><use href="#leafShape" transform="scale(0.7)"/></g>
    </g>
    <g transform="translate(170,-20)" fill="#a3b24a">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-20; 13,92; -10,192; 5,300" keyTimes="0;0.33;0.66;1" dur="7.9s" begin="-6.8s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="3.6s" repeatCount="indefinite"/><use href="#leafShape" transform="scale(0.9)"/></g>
    </g>
    <g transform="translate(290,-20)" fill="#7c9a52">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-20; -11,97; 9,197; -4,300" keyTimes="0;0.33;0.66;1" dur="8.3s" begin="-0.8s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="3.9s" repeatCount="indefinite"/><use href="#leafShape" transform="scale(0.78)"/></g>
    </g>
    <g transform="translate(410,-20)" fill="#d99b3f">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-20; 12,93; -14,193; 7,300" keyTimes="0;0.33;0.66;1" dur="7.5s" begin="-4.2s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.2s" repeatCount="indefinite"/><use href="#leafShape" transform="scale(0.82)"/></g>
    </g>
    <g transform="translate(530,-20)" fill="#b3541f">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-20; -13,96; 10,196; -5,300" keyTimes="0;0.33;0.66;1" dur="9.1s" begin="-2.9s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="4.3s" repeatCount="indefinite"/><use href="#leafShape" transform="scale(0.68)"/></g>
    </g>
    <g transform="translate(650,-20)" fill="#c9762b">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,-20; 8,94; -10,194; 6,300" keyTimes="0;0.33;0.66;1" dur="8.1s" begin="-5.9s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.4s" repeatCount="indefinite"/><use href="#leafShape" transform="scale(0.76)"/></g>
    </g>
  </g>

  <!-- small twig accents -->
  <g stroke="#4a3018" stroke-width="2" opacity="0.25" fill="none">
    <path d="M110,100 q15,-20 30,-10"/>
    <path d="M270,95 q15,-20 30,-10"/>
    <path d="M430,95 q15,-20 30,-10"/>
    <path d="M590,105 q15,-18 28,-8"/>
    <path d="M170,205 q-15,18 -30,8"/>
    <path d="M330,205 q-15,18 -30,8"/>
    <path d="M490,205 q-15,18 -30,8"/>
  </g>

  <!-- Name text: layered halo (white outer + black inner) keeps it legible on both black and white backgrounds, gradient fill on top -->
  <text x="400" y="163" font-family="Georgia, 'Times New Roman', serif" font-size="62"
        font-weight="bold" fill="none" text-anchor="middle"
        stroke="#ffffff" stroke-width="5" stroke-linejoin="round" opacity="0.85">Ayush Sharma</text>
  <text x="400" y="163" font-family="Georgia, 'Times New Roman', serif" font-size="62"
        font-weight="bold" fill="none" text-anchor="middle"
        stroke="#000000" stroke-width="1.6" stroke-linejoin="round" opacity="0.85">Ayush Sharma</text>
  <text x="400" y="163" font-family="Georgia, 'Times New Roman', serif" font-size="62"
        font-weight="bold" fill="url(#duoGrad)" text-anchor="middle">Ayush Sharma</text>
</svg>
